[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "venomshadows-site"
version = "0.1.0"
description = "Сайт site.venomshadows.ru"
readme = "README.md"
requires-python = ">=3.12"
# На Windows tzdata даёт ZoneInfo базу часовых поясов; на Linux используется системная база.
dependencies = ["flask>=3.0,<4", "requests>=2.31,<3", "tzdata; platform_system == 'Windows'"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]
deploy = ["gunicorn>=22.0,<24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
site_app = ["templates/*.html", "static/*.css", "static/*.js", "static/img/*", "static/favicon/*"]
