<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}venom_shadows site{% endblock %}</title>
  <link rel="icon" href="{{ static_url('favicon/favicon.ico') }}" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ static_url('favicon/favicon-32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ static_url('favicon/favicon-16.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ static_url('favicon/apple-touch-icon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ static_url('style.css') }}">
</head>
{# Картинки фона передаются в CSS переменными, а не прописаны в style.css:
   адреса внутри CSS браузер кэширует отдельно, без версии, и после обновления
   картинки продолжал бы показывать старую (см. static_url в webapp.py). #}
<body style="--clouds: url('{{ static_url('img/clouds.svg') }}'); --rain: url('{{ static_url('img/rain.svg') }}');">
  <div class="bg-clouds"></div>
  <div class="bg-rain bg-rain--far"></div>
  <div class="bg-rain bg-rain--near"></div>
  <div class="bg-glow"></div>

  {% block body %}{% endblock %}

</body>
</html>
